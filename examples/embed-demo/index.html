<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宿主项目 · 嵌入 GlintChat 面板</title>
    <script>
      // 宿主自己的主题初始化（面板会跟随这个 .dark 类）
      (function () {
        try {
          if (localStorage.getItem('demo_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
