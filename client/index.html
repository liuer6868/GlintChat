<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="GlintChat - 轻量级无数据库 AI 智能对话助手，支持流式输出、Markdown 渲染与思维链展示" />
    <meta name="theme-color" content="#0b1120" />
    <title>GlintChat · 轻量级 AI 对话助手</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 21.5c1.6-1 2.6-2.4 2.8-4.2.2-1.6.9-2.9 2.2-3.9 1.2-.9 2.7-1.3 4.5-1.6l1.4-.2c1.6-.3 2.4-.7 2.6-1.3-1.6-.6-3-.8-4.4-.7-2 .2-3.8 1-5.4 2.5-1.5 1.4-2.5 3.1-2.8 5.2-.3 1.7-.6 3-.9 4.2z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // 主题初始化：避免首屏白闪
      (function () {
        try {
          var stored = localStorage.getItem('glintchat_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
